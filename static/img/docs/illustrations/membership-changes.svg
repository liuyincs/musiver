    <text x="660" y="120">Equalizer · music roaming</text>
    <text x="660" y="150">Immersive / PiP lyrics</text>
    <text x="660" y="180">Vinyl · accent · transparent</text>
    <text x="660" y="210">App icon (iOS)</text>
